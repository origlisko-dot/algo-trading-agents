[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading-agents"
version = "0.1.0"
description = "ML/agent stack for US-equity algorithmic trading (research scaffold)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["algo_agents*"]

[tool.ruff]
line-length = 100
target-version = "py310"
